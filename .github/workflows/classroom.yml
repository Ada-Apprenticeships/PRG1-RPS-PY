name: Autograding
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  run-autograding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: education/autograding@v1
        id: autograding